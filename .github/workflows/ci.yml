name: CI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify required toolchain
        run: |
          command -v bash
          command -v node
          command -v npm
          command -v python3
          command -v pwsh

      - name: Run complete non-Windows validation
        run: make check

  windows-check:
    name: Windows check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify native-Windows toolchain
        shell: powershell
        run: |
          Get-Command cmd.exe | Out-Null
          Get-Command java.exe | Out-Null
          Get-Command powershell.exe | Out-Null
          Get-Command python.exe | Out-Null

      - name: Run native-Windows validation
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File tests\windows-integration.ps1 -Suite All

  codeql:
    name: CodeQL
    # Temporarily disabled because GitHub Advanced Security is unavailable.
    if: false
    # if: github.repository_owner == 'buildish-tooling'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: kotlin
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false

  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - check
      - windows-check
      - codeql
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Assert required jobs succeeded and CodeQL was acceptable
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          WINDOWS_CHECK_RESULT: ${{ needs.windows-check.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          if [ "$CHECK_RESULT" != success ]; then
            echo "Linux check did not succeed: $CHECK_RESULT"
            exit 1
          fi
          if [ "$WINDOWS_CHECK_RESULT" != success ]; then
            echo "Windows check did not succeed: $WINDOWS_CHECK_RESULT"
            exit 1
          fi
          if [ "$ZIZMOR_RESULT" != success ]; then
            echo "zizmor did not succeed: $ZIZMOR_RESULT"
            exit 1
          fi

          case "$CODEQL_RESULT" in
            success|skipped) ;;
            *)
              echo "CodeQL had an unexpected result: $CODEQL_RESULT"
              exit 1
              ;;
          esac

          echo "All required jobs succeeded for this event."

  publish-site:
    name: Publish aggregate site
    needs: required_checks
    # Requires BUILDISH_SITE_PUBLISH_TOKEN with Actions write access to the
    # buildish-tooling/buildish repository.
    if: >-
      always() &&
      !cancelled() &&
      needs.required_checks.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
      && false
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch aggregate site publishing
        env:
          GH_TOKEN: ${{ secrets.BUILDISH_SITE_PUBLISH_TOKEN }}
        run: gh workflow run site-publish.yml --repo buildish-tooling/buildish --ref main
