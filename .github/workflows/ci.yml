name: CI

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.14.4
        env:
          GRADLE_VERSION: 8.14.4
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          checksum_file="$archive.sha256"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o "$archive"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip.sha256" -o "$checksum_file"
          printf '%s  %s\n' "$(tr -d '\r\n' < "$checksum_file")" "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify required toolchain
        run: |
          command -v gradle
          command -v pwsh
          command -v gpg

      - name: Run default helper integration suite
        run: make test

      - name: Apache RAT check
        run: sh scripts/rat-check.sh

  windows-check:
    name: Windows check
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.14.4
        env:
          GRADLE_VERSION: 8.14.4
        shell: pwsh
        run: |
          $archive = Join-Path -Path $env:RUNNER_TEMP -ChildPath "gradle-$env:GRADLE_VERSION-bin.zip"
          $checksumFile = "$archive.sha256"
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-$env:GRADLE_VERSION-bin.zip" -OutFile $archive
          Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-$env:GRADLE_VERSION-bin.zip.sha256" -OutFile $checksumFile
          $expectedHash = (Get-Content -LiteralPath $checksumFile -Raw).Trim()
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash.ToLowerInvariant()) {
            throw "Gradle SHA-256 mismatch for $archive. expected=$expectedHash actual=$actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP -Force
          $gradleBinDirectory = Join-Path -Path (Join-Path -Path $env:RUNNER_TEMP -ChildPath "gradle-$env:GRADLE_VERSION") -ChildPath 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $gradleBinDirectory

      - name: Verify required baseline toolchain
        shell: pwsh
        run: |
          Get-Command gradle | Out-Null
          Get-Command bash | Out-Null
          Get-Command pwsh | Out-Null
          $gpgCommands = @(
            @(Get-Command gpg.exe -All -ErrorAction SilentlyContinue)
            @(Get-Command gpg -All -ErrorAction SilentlyContinue)
          ) | Where-Object { $null -ne $_ } | Sort-Object -Property Source -Unique
          if ($gpgCommands.Count -eq 0) {
            throw 'gpg.exe or gpg was not found on PATH.'
          }
          $nonGitGpgCommands = @($gpgCommands | Where-Object {
            $normalizedPath = $_.Source.Replace('/', '\').ToLowerInvariant()
            (-not $normalizedPath.Contains('\git\usr\bin\')) -and (-not $normalizedPath.Contains('\git\mingw64\bin\'))
          })
          if ($nonGitGpgCommands.Count -gt 0) {
            throw "Expected only Git for Windows GPG before native GnuPG installation, but found: $($nonGitGpgCommands.Source -join ', ')"
          }

      - name: Check gpg command and version
        run: |
          Get-Command gpg -All
          gpg --version

      - name: Verify Git-for-Windows GPG rejection path
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File tests/windows-git-gpg-rejection.ps1

      - name: Install GnuPG
        shell: pwsh
        env:
          GNUPG_WINDOWS_INSTALLER_URL: https://gnupg.org/ftp/gcrypt/binary/gnupg-w32-2.5.18_20260224.exe
          # See ../signatures/README.md for details on the pinned allowed GnuPG release-signing public key.
          GNUPG_WINDOWS_INSTALLER_SIGNATURE_PATH: .github/signatures/gnupg-w32-2.5.18_20260224.exe.sig
          GNUPG_WINDOWS_SIGNATURE_KEY_PATH: .github/signatures/signature_key.asc
          GNUPG_WINDOWS_ALLOWED_SIGNER_FINGERPRINT: 6DAA6E64A76D2840571B4902528897B826403ADA
        run: |
          $archive = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'gnupg-install.exe'
          $signaturePath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath $env:GNUPG_WINDOWS_INSTALLER_SIGNATURE_PATH
          $signatureKeyPath = Join-Path -Path $env:GITHUB_WORKSPACE -ChildPath $env:GNUPG_WINDOWS_SIGNATURE_KEY_PATH
          $bootstrapGpgHome = Join-Path -Path $env:RUNNER_TEMP -ChildPath 'gnupg-bootstrap-home'
          $extractDirectory = 'C:\gnupg_raw'

          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "Missing pinned installer signature at '$signaturePath'."
          }

          if (-not (Test-Path -LiteralPath $signatureKeyPath)) {
            throw "Missing pinned GnuPG signature key file at '$signatureKeyPath'."
          }

          if (Test-Path -LiteralPath $bootstrapGpgHome) {
            Remove-Item -LiteralPath $bootstrapGpgHome -Recurse -Force
          }
          New-Item -ItemType Directory -Path $bootstrapGpgHome | Out-Null

          if (Test-Path -LiteralPath $extractDirectory) {
            Remove-Item -LiteralPath $extractDirectory -Recurse -Force
          }

          # The runtime helper intentionally rejects Git-for-Windows GPG for batch
          # launcher verification, but this CI bootstrap step only needs a
          # temporary verifier for the pinned detached signature below.
          Invoke-WebRequest -Uri $env:GNUPG_WINDOWS_INSTALLER_URL -OutFile $archive
          $importOutput = & gpg --homedir $bootstrapGpgHome --batch --import $signatureKeyPath 2>&1
          if ($LASTEXITCODE -ne 0) {
            $importOutput | ForEach-Object { Write-Host $_ }
            throw 'Unable to import the pinned GnuPG release-signing public key.'
          }

          $verificationOutput = & gpg --homedir $bootstrapGpgHome --batch --status-fd 1 --verify $signaturePath $archive 2>&1
          $verificationExitCode = $LASTEXITCODE
          $verificationOutput | ForEach-Object { Write-Host $_ }
          if ($verificationExitCode -ne 0) {
            throw 'The downloaded GnuPG installer failed detached-signature verification.'
          }

          $expectedValidSigPrefix = "[GNUPG:] VALIDSIG $env:GNUPG_WINDOWS_ALLOWED_SIGNER_FINGERPRINT "
          if (-not ($verificationOutput | Where-Object { $_.StartsWith($expectedValidSigPrefix) })) {
            throw "The downloaded GnuPG installer was not signed by the expected release key $env:GNUPG_WINDOWS_ALLOWED_SIGNER_FINGERPRINT."
          }

          7z x $archive "-o$extractDirectory" -y
          $binPath = Resolve-Path (Join-Path -Path $extractDirectory -ChildPath 'bin') | Select-Object -ExpandProperty Path
          Add-Content -Path $env:GITHUB_PATH -Value $binPath

      - name: Check gpg command and version
        run: |
          Get-Command gpg -All
          gpg --version

      - name: Verify required toolchain
        shell: pwsh
        run: |
          Get-Command gradle | Out-Null
          Get-Command bash | Out-Null
          Get-Command pwsh | Out-Null
          $gpgCommand = Get-Command gpg.exe -ErrorAction SilentlyContinue
          if ($null -eq $gpgCommand) {
            $gpgCommand = Get-Command gpg -ErrorAction SilentlyContinue
          }
          if ($null -eq $gpgCommand) {
            throw 'gpg.exe or gpg was not found on PATH.'
          }
          if ($gpgCommand.Source.Replace('/', '\').ToLowerInvariant().Contains('\git\')) {
            throw "Native Windows GnuPG was expected after installation, but Git for Windows GPG is still selected: $($gpgCommand.Source)"
          }

      - name: Run Windows launcher integration suite
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File tests/windows-integration.ps1


  codeql:
    name: CodeQL
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        with:
          languages: kotlin
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2
        with:
          advanced-security: false

  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - check
      - windows-check
      - codeql
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded or were intentionally skipped
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          WINDOWS_CHECK_RESULT: ${{ needs.windows-check.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          for result in \
            "$CHECK_RESULT" \
            "$WINDOWS_CHECK_RESULT" \
            "$CODEQL_RESULT" \
            "$ZIZMOR_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Unexpected dependency result: $result"
                exit 1
                ;;
            esac
          done

          echo "All required jobs succeeded for this event."
